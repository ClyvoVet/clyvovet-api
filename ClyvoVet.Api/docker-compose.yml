name: clyvovet

networks:
  clyvo-network:
    driver: bridge

volumes:
  clyvovet_oracle_data:
  clyvovet_mongo_data:

services:
  db-oracle:
    image: gvenzl/oracle-free:latest
    container_name: db-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_ROOT_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    volumes:
      - clyvovet_oracle_data:/opt/oracle/oradata
    networks:
      - clyvo-network
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s

  db-mongo:
    image: mongo:8.0
    container_name: db-mongo
    restart: unless-stopped
    volumes:
      - clyvovet_mongo_data:/data/db
    networks:
      - clyvo-network
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  clyvo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clyvovet-api:local
    container_name: clyvo-api
    restart: unless-stopped
    user: app
    depends_on:
      db-oracle:
        condition: service_healthy
      db-mongo:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5139
      ConnectionStrings__OracleDbConnection: "Data Source=db-oracle:1521/FREEPDB1;User Id=${ORACLE_APP_USER};Password=${ORACLE_APP_PASSWORD};"
      ConnectionStrings__Mongodb: "mongodb://db-mongo:27017"
      Secretkey: "${JWT_SECRET_KEY:NcUilK9lfRfEexW1lAdLtxlEjP9PjL}"
    ports:
      - "5139:5139"
    networks:
      - clyvo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5139/api/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
