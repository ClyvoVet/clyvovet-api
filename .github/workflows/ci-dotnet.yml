name: .NET API CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar API
        run: dotnet restore ./ClyvoVet.Api/ClyvoVet.Api.csproj

      - name: Restaurar testes unitários
        run: dotnet restore ./ClyvoVet.Tests.Unit/ClyvoVet.Tests.Unit.csproj

      - name: Restaurar testes de integração
        run: dotnet restore ./ClyvoVet.Tests.Integration/ClyvoVet.Tests.Integration.csproj

      - name: Compilar API
        run: dotnet build ./ClyvoVet.Api/ClyvoVet.Api.csproj --no-restore --configuration Release

      - name: Executar testes unitários
        run: dotnet test ./ClyvoVet.Tests.Unit/ClyvoVet.Tests.Unit.csproj --configuration Release --collect:"XPlat Code Coverage"

      - name: Executar testes de integração
        run: dotnet test ./ClyvoVet.Tests.Integration/ClyvoVet.Tests.Integration.csproj --configuration Release --collect:"XPlat Code Coverage"
